<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trip Itinerary Map</title>
    <link rel="stylesheet" href="../shared/planner.css?v=20260626-flex-connectors" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-title">
        <p id="trip-eyebrow" class="eyebrow">Trip planner</p>
        <h1 id="trip-heading">Trip Planner</h1>
      </div>
      <div class="header-actions">
        <span id="source-indicator" class="source-indicator" aria-live="polite">官方行程</span>
        <div id="trip-clock" class="clock" aria-live="polite">当地时间 --:--</div>
        <button id="editor-toggle" class="header-link" type="button">编辑行程</button>
      </div>
    </header>

    <div class="trip-controls">
      <nav class="mobile-view-tabs" aria-label="Trip views">
        <button class="mobile-view-tab active" type="button" data-mobile-view="planner">行程</button>
        <button class="mobile-view-tab" type="button" data-mobile-view="map">地图</button>
      </nav>
    </div>

    <main id="map-view" class="app-shell view-panel" data-mobile-view="planner">
      <aside class="planner-panel">
        <section class="panel-section">
          <div id="day-tabs" class="day-tabs" aria-label="Choose itinerary day"></div>
          <div id="timeline" class="timeline"></div>
        </section>
      </aside>

      <section class="map-panel">
        <div id="map" class="map" role="application" aria-label="Google itinerary map">
          <div class="map-empty-state">
            <strong>正在加载地图</strong>
            <span>默认读取仓库里的路线缓存；未缓存的路段会显示计划连线。</span>
          </div>
        </div>
        <div class="map-toolbar">
          <button id="locate-me" type="button" class="secondary">定位我</button>
          <button id="open-google-maps" type="button">打开 Google Maps 路线</button>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </section>
    </main>

    <main id="editor-view" class="editor-page view-panel" hidden>
      <section class="panel-section editor-section">
        <div class="section-title-row">
          <div>
            <p class="eyebrow">Itinerary</p>
            <h2>编辑行程</h2>
          </div>
          <label class="file-button">
            导入本地 JSON
            <input id="json-file" type="file" accept="application/json,.json" />
          </label>
        </div>
        <div class="source-editor">
          <div id="itinerary-source-switch" class="source-switch" role="tablist" aria-label="行程版本">
            <button
              class="source-option active"
              type="button"
              role="tab"
              data-itinerary-source="official"
              aria-selected="true"
            >
              官方
            </button>
            <button
              class="source-option"
              type="button"
              role="tab"
              data-itinerary-source="local"
              aria-selected="false"
            >
              本地
            </button>
          </div>
          <p id="source-description" class="source-description"></p>
        </div>
        <textarea id="itinerary-json" spellcheck="false"></textarea>
        <div class="button-row">
          <button id="apply-json" type="button" hidden>更新</button>
          <button id="download-json" type="button" class="secondary">下载</button>
          <button id="copy-json" type="button" class="secondary">复制代码</button>
          <button id="delete-local-version" type="button" class="secondary" hidden>删除</button>
        </div>
      </section>
    </main>

    <script src="../site-config.js?v=20260625-live-data"></script>
    <script src="./trip-config.js?v=20260625-live-data"></script>
    <script src="../shared/route-cache.js?v=20260625-live-data"></script>
    <script src="../shared/timeline-model.js?v=20260626-flex-connectors"></script>
    <script src="../shared/planner.js?v=20260626-flex-connectors" defer></script>
  </body>
</html>
