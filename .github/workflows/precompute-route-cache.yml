name: Precompute route cache

on:
  push:
    branches:
      - main
    paths:
      - "trips.json"
      - "site-config.js"
      - "shared/**"
      - "*/itinerary.json"
      - "*/trip-config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/precompute-route-cache.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  precompute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Generate route cache
        run: npm run precompute:all
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Commit route cache
        run: |
          if git diff --quiet -- */route-cache.json; then
            echo "route-cache files are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add */route-cache.json
          git commit -m "Update route cache"
          git push
