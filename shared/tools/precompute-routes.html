<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trip Route Cache Generator</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: #f2f2f7;
        color: #111827;
      }

      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 28px 20px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        letter-spacing: 0;
      }

      p {
        color: #6b7280;
      }

      pre {
        min-height: 320px;
        overflow: auto;
        border: 1px solid rgba(60, 60, 67, 0.14);
        border-radius: 12px;
        background: #fff;
        padding: 16px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Route Cache Generator</h1>
      <p id="route-cache-status">准备读取 trip itinerary...</p>
      <pre id="route-cache-json">{}</pre>
    </main>

    <script src="../../site-config.js"></script>
    <script src="../route-cache.js"></script>
    <script src="./precompute-routes.js" defer></script>
  </body>
</html>
